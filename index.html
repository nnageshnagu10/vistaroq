<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VISTAROQ</title>

  <!-- Preload Core Images for First Steps -->
  <link rel="preload" as="image" href="welcome.png" />
  <link rel="preload" as="image" href="img2.png" />
  <link rel="preload" as="image" href="nest.png" />
  <link rel="preload" as="image" href="craft.png" />
  <link rel="preload" as="image" href="link.png" />
  <link rel="preload" as="image" href="force.png" />
  <link rel="preload" as="image" href="hub.png" />
  <link rel="preload" as="image" href="img3.png" />
  <link rel="preload" as="image" href="img3a.png" />
  <link rel="preload" as="image" href="img4.png" />
  <link rel="preload" as="image" href="img5.png" />
  <link rel="preload" as="image" href="img6.png" />
  <link rel="preload" as="image" href="img7.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    
    /* Screen Isolation Architecture */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      overflow: hidden;
      z-index: 1;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 10;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Universal Help Button */
    .global-help-btn {
      position: absolute;
      top: 2.2%;
      right: 3.5%;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      z-index: 100;
      cursor: pointer;
    }

    /* Screen 1 Button */
    .welcome-cta {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 310px;
      height: 44px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
    }

    /* Screen 2 Hub & Carousel */
    .hub-btn {
      position: absolute;
      top: 1.6%;
      right: 15%;
      width: 21%;
      max-width: 88px;
      z-index: 50;
      cursor: pointer;
    }
    .hub-btn img { width: 100%; display: block; }

    .cards-wrapper {
      position: absolute;
      top: 52%;
      left: 0;
      width: 100%;
      height: 31%;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cards-track { width: 100%; height: 100%; position: relative; }
    .card-item {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38%;
      max-width: 155px;
      height: 100%;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
      cursor: pointer;
    }
    .card-item img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
    .card-item.active { transform: translateX(-50%) scale(1.05); opacity: 1; z-index: 20; pointer-events: auto; }

    /* Navigation Header */
    .nest-nav {
      position: absolute;
      top: 1.6%;
      left: 0;
      width: 100%;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }
    .clean-back-arrow { background: transparent; border: none; cursor: pointer; color: #fff; padding: 4px; }
    .clean-back-arrow svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.2; fill: none; }

    /* Glass Cards (Login & Signup) */
    .login-card-container {
      position: absolute;
      bottom: 40px;
      right: 3.5%;
      width: 71%;
      max-width: 300px;
      z-index: 40;
    }
    .signup-card-container {
      position: absolute;
      bottom: 20px;
      right: 3.5%;
      width: 74%;
      max-width: 312px;
      z-index: 40;
    }
    .glass-arch-card {
      background: rgba(255, 245, 230, 0.45);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 245, 220, 0.7);
      border-radius: 80px 80px 20px 20px;
      padding: 18px 14px 12px;
      text-align: center;
    }
    .text-input {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 30px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.9);
      font-size: 10px;
      margin-bottom: 6px;
    }
    .action-btn {
      width: 100%;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #f7e09e 0%, #dbaf4f 50%, #b8840b 100%);
      color: #1a1a1a;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    /* Hotspots for Hub, Portals, and Scanning */
    .hotspot-box-hub { position: absolute; top: 51.5%; left: 3.5%; width: 45%; height: 14.5%; z-index: 40; cursor: pointer; }
    .hotspot-box-open { position: absolute; top: 51.5%; right: 3.5%; width: 45%; height: 14.5%; z-index: 40; cursor: pointer; }
    
    .portal-hotspot { flex: 1; height: 100%; border-radius: 30px; cursor: pointer; }
    .portals-container { position: absolute; top: 42%; left: 2%; width: 96%; height: 34%; display: flex; gap: 1.5%; z-index: 40; }

    .measure-card-hotspot { flex: 1; height: 100%; border-radius: 18px; cursor: pointer; }
    .measure-methods-container { position: absolute; top: 59.5%; left: 3.5%; width: 93%; height: 27%; display: flex; gap: 2.5%; z-index: 40; }

    .invisible-back { position: absolute; top: 2%; left: 3%; width: 45px; height: 45px; z-index: 60; cursor: pointer; }
    .finish-scan { position: absolute; bottom: 4.2%; left: 19%; width: 62%; height: 6.8%; z-index: 50; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- SCREEN 1: WELCOME -->
    <div id="screen-1" class="screen active">
      <div class="global-help-btn" onclick="alert('Help & Support: Welcome')"></div>
      <img class="bg-img" src="welcome.png" alt="Welcome" />
      <div class="welcome-cta" onclick="goToScreen(2)">
        <span style="font-size:10px; font-weight:700;">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
        <span style="font-size:14px; font-weight:700; margin-left:6px; color:#b8860b;">→</span>
      </div>
    </div>

    <!-- SCREEN 2: EXPERIENCE CAROUSEL -->
    <div id="screen-2" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Experience')"></div>
      <img class="bg-img" src="img2.png" alt="Experience" />
      <div class="hub-btn" onclick="alert('⚡ VISTAROQ HUB: Employee Access Only')"><img src="hub.png" alt="Hub" /></div>
      <div class="cards-wrapper">
        <div class="cards-track">
          <div class="card-item active" onclick="goToScreen(3)"><img src="nest.png" alt="Nest" /></div>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: LOGIN -->
    <div id="screen-3" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Login')"></div>
      <img class="bg-img" src="img3.png" alt="Login" />
      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(2)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      </div>
      <div class="login-card-container">
        <div class="glass-arch-card">
          <div style="font-size:10px; font-weight:700; margin-bottom:8px;">VISTAROQ IDENTITY</div>
          <input type="text" class="text-input" placeholder="Email or Mobile" />
          <input type="password" class="text-input" placeholder="Password" />
          <button class="action-btn" onclick="goToScreen(5)">Sign In →</button>
          <button class="action-btn" style="background:#fff; border:1px solid #ccc; margin-top:4px;" onclick="goToScreen(4)">Create Account</button>
        </div>
      </div>
    </div>

    <!-- SCREEN 4: SIGNUP -->
    <div id="screen-4" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Signup')"></div>
      <img class="bg-img" src="img3a.png" alt="Signup" />
      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(3)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      </div>
      <div class="signup-card-container">
        <div class="glass-arch-card">
          <div style="font-size:10px; font-weight:700; margin-bottom:6px;">CREATE IDENTITY</div>
          <input type="text" class="text-input" placeholder="Full Name" />
          <input type="text" class="text-input" placeholder="Email / Mobile" />
          <input type="password" class="text-input" placeholder="Password" />
          <button class="action-btn" onclick="goToScreen(5)">Create Account →</button>
        </div>
      </div>
    </div>

    <!-- SCREEN 5: SPACES HUB -->
    <div id="screen-5" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Hub')"></div>
      <img class="bg-img" src="img4.png" alt="Hub" />
      <div class="hotspot-box-hub" onclick="goToScreen(6)"></div>
      <div class="hotspot-box-open" onclick="alert('📂 Opening Existing Space...')"></div>
    </div>

    <!-- SCREEN 6: CREATE SPACE PORTALS -->
    <div id="screen-6" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Portals')"></div>
      <img class="bg-img" src="img5.png" alt="Portals" />
      <button class="clean-back-arrow" onclick="goToScreen(5)" style="position:absolute;top:2%;left:4%;z-index:60;"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      <div class="portals-container">
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
      </div>
    </div>

    <!-- SCREEN 7: MEASURE METHODS -->
    <div id="screen-7" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Measure')"></div>
      <img class="bg-img" src="img6.png" alt="Measure" />
      <button class="clean-back-arrow" onclick="goToScreen(6)" style="position:absolute;top:2%;left:4%;z-index:60;"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      <div class="measure-methods-container">
        <div class="measure-card-hotspot" onclick="goToScreen(8)"></div>
        <div class="measure-card-hotspot" onclick="alert('Manual Entry Selected')"></div>
        <div class="measure-card-hotspot" onclick="alert('Upload Floor Plan Selected')"></div>
      </div>
    </div>

    <!-- SCREEN 8: LIVE SCAN (img7.png) -->
    <div id="screen-8" class="screen">
      <div class="global-help-btn" onclick="alert('Help & Support: Scan')"></div>
      <img class="bg-img" src="img7.png" alt="Live Scan" />
      <div class="invisible-back" onclick="goToScreen(7)"></div>
      <div class="finish-scan" onclick="alert('✨ Scan Complete! Ready for Space Understanding (Next Step).')"></div>
    </div>

  </div>

  <script>
    let currentScreen = 1;
    function goToScreen(screenNumber) {
      document.getElementById('screen-' + currentScreen).classList.remove('active');
      document.getElementById('screen-' + screenNumber).classList.add('active');
      currentScreen = screenNumber;
    }
  </script>
</body>
</html>
