<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .app-screen {
      width: 100vw;
      max-width: 450px;
      height: 100vh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }
    .action-zone {
      position: relative;
      z-index: 5;
      width: 100%;
      padding: 0 28px 110px 28px;
      display: flex;
      justify-content: center;
    }
    .touch-btn {
      width: 100%;
      height: 58px;
      border-radius: 35px;
      border: 1.5px solid rgba(223, 178, 106, 0.5);
      background: rgba(223, 178, 106, 0.05);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .touch-btn:active {
      background: rgba(223, 178, 106, 0.35);
      transform: scale(0.98);
      box-shadow: 0 0 25px rgba(223, 178, 106, 0.8);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img class="bg-img" src="https://raw.githubusercontent.com/nnageshnagu10/vistaroq/main/file_00000000b9bc81fa928afea182e38eb7.png" alt="VISTAROQ Welcome" />
    <div class="action-zone">
      <button class="touch-btn" onclick="alert('✨ VISTAROQ: Welcome Screen Verified!')">
      </button>
    </div>
  </div>

</body>
</html>
