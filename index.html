<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VISTAROQ</title>

  <!-- ========================================================
       ULTRA-FAST PRELOAD ENGINE (ZERO QUALITY LOSS)
       ======================================================== -->
  <link rel="preload" as="image" href="welcome.png" />
  <link rel="preload" as="image" href="img2.png" />
  <link rel="preload" as="image" href="nest.png" />
  <link rel="preload" as="image" href="craft.png" />
  <link rel="preload" as="image" href="link.png" />
  <link rel="preload" as="image" href="force.png" />
  <link rel="preload" as="image" href="hub.png" />
  <link rel="preload" as="image" href="img3.png" />
  <link rel="preload" as="image" href="img3a.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease-in-out;
      overflow: hidden;
      will-change: opacity;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* --- SCREEN 1: WELCOME BUTTON --- */
    .cta-btn {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 310px;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease;
    }
    .cta-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
    .cta-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .cta-arrow {
      font-size: 15px;
      font-weight: 700;
      color: #b8860b;
    }

    /* --- SCREEN 2: HUB BUTTON --- */
    .hub-btn {
      position: absolute;
      top: 1.6%;
      right: 3.5%;
      width: 21%;
      max-width: 88px;
      z-index: 15;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .hub-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }
    .hub-btn:active {
      transform: scale(0.92);
    }

    /* --- SCREEN 2: CARD SLIDER --- */
    .cards-wrapper {
      position: absolute;
      top: 52%;
      left: 0;
      width: 100%;
      height: 31%;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }
    .cards-track {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .card-item {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38%;
      max-width: 155px;
      height: 100%;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
      cursor: pointer;
      will-change: transform, opacity;
    }
    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
    }
    .card-item.active {
      transform: translateX(-50%) scale(1.05);
      opacity: 1;
      z-index: 10;
      pointer-events: auto;
    }
    .card-item.prev {
      transform: translateX(-138%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }
    .card-item.next {
      transform: translateX(38%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }

    /* --- SCREEN 2: DOT INDICATORS --- */
    .dots-container {
      position: absolute;
      bottom: 12%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 15;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #d4af37;
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      transform: scale(1.25);
    }

    /* =========================================
       COMMON NAVIGATION & MULTI-LANGUAGE
       ========================================= */
    .nest-nav {
      position: absolute;
      top: env(safe-area-inset-top, 1.6%);
      left: 0;
      width: 100%;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }
    
    .clean-back-arrow {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
      transition: transform 0.15s ease;
    }
    .clean-back-arrow svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.2;
    }
    .clean-back-arrow:active {
      transform: scale(0.9);
    }

    .lang-dropdown-wrapper {
      position: relative;
    }
    .lang-pill-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 18px;
      color: #1a1a1a;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }
    .lang-pill-btn svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: #222;
      stroke-width: 1.8;
    }
    .lang-menu {
      position: absolute;
      top: 32px;
      right: 0;
      width: 180px;
      max-height: 250px;
      overflow-y: auto;
      background: rgba(18, 22, 28, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
      display: none;
      z-index: 100;
      scrollbar-width: thin;
      scrollbar-color: #d4af37 transparent;
    }
    .lang-menu.show {
      display: block;
    }
    .lang-group-header {
      padding: 6px 12px 3px;
      font-size: 9.5px;
      font-weight: 700;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(0,0,0,0.3);
    }
    .lang-item {
      padding: 7px 12px;
      font-size: 11.5px;
      color: #e8e8e8;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      transition: background 0.15s ease;
    }
    .lang-item:hover, .lang-item.active {
      background: rgba(212, 175, 55, 0.25);
      color: #ffd700;
      font-weight: 600;
    }

    /* =========================================
       GLASS CARDS (LOGIN & SIGN UP)
       ========================================= */
    .login-card-container {
      position: absolute;
      bottom: 50px;
      right: 3.5%;
      width: 71%;
      max-width: 300px;
      z-index: 25;
    }
    .signup-card-container {
      position: absolute;
      bottom: 30px;
      right: 3.5%;
      width: 74%;
      max-width: 312px;
      z-index: 25;
    }
    .glass-arch-card {
      background: linear-gradient(175deg, rgba(255, 245, 230, 0.45) 0%, rgba(240, 222, 190, 0.35) 100%);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1.5px solid rgba(255, 245, 220, 0.7);
      border-radius: 95px 95px 24px 24px;
      padding: 22px 15px 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.7);
      text-align: center;
    }
    .card-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #111;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .card-subtitle {
      font-size: 8.8px;
      color: #2b2b2b;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* High Precision Frosted Inputs */
    .input-field {
      position: relative;
      margin-bottom: 6px;
      width: 100%;
    }
    .input-icon-svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      stroke: #333;
      fill: none;
      stroke-width: 1.8;
    }
    .text-input {
      width: 100%;
      height: 34px;
      padding: 0 32px 0 32px;
      border-radius: 17px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.84);
      font-size: 10.5px;
      color: #111;
      transition: all 0.2s ease;
    }
    .text-input::placeholder {
      color: #555;
    }
    .text-input:focus {
      background: rgba(255, 255, 255, 0.98);
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }
    .toggle-pass-btn {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      stroke: #444;
      fill: none;
      stroke-width: 1.8;
      cursor: pointer;
    }

    /* Options & Checkbox */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.8px;
      margin: 5px 2px 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #111;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .checkbox-label input {
      accent-color: #b8860b;
      transform: scale(0.85);
    }
    .terms-text {
      font-size: 8px;
      color: #222;
      line-height: 1.2;
    }
    .terms-text a {
      color: #7a5814;
      text-decoration: underline;
      font-weight: 700;
    }
    .forgot-link {
      color: #7a5814;
      text-decoration: none;
      font-weight: 700;
    }

    /* Gold Buttons */
    .action-btn {
      width: 100%;
      height: 35px;
      border-radius: 18px;
      border: 1px solid rgba(255, 240, 195, 0.8);
      background: linear-gradient(135deg, #f7e09e 0%, #dbaf4f 50%, #b8840b 100%);
      color: #1a1a1a;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.38);
      transition: transform 0.15s ease;
    }
    .action-btn:active {
      transform: scale(0.97);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 5px 0;
      color: #444;
      font-size: 7.5px;
      font-weight: 700;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(0, 0, 0, 0.18);
    }
    .divider span {
      padding: 0 5px;
    }

    .secondary-btn {
      width: 100%;
      height: 34px;
      border-radius: 17px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.88);
      color: #1a1a1a;
      font-size: 9.8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease;
    }
    .secondary-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- SCREEN 1: WELCOME -->
    <div id="screen-1" class="screen active">
      <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
      <button class="cta-btn" onclick="goToScreen(2)">
        <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <!-- SCREEN 2: EXPERIENCE CAROUSEL -->
    <div id="screen-2" class="screen">
      <img class="bg-img" src="img2.png" alt="VISTAROQ Experience" />

      <div class="hub-btn" onclick="alert('⚡ VISTAROQ HUB: Employee Access Only')">
        <img src="hub.png" alt="VISTAROQ HUB" />
      </div>

      <div class="cards-wrapper" id="swipeArea">
        <div class="cards-track">
          <div class="card-item" onclick="onCardClick('NEST')">
            <img src="nest.png" alt="NEST" />
          </div>
          <div class="card-item" onclick="onCardClick('CRAFT')">
            <img src="craft.png" alt="CRAFT" />
          </div>
          <div class="card-item" onclick="onCardClick('LINK')">
            <img src="link.png" alt="LINK" />
          </div>
          <div class="card-item" onclick="onCardClick('FORCE')">
            <img src="force.png" alt="FORCE" />
          </div>
        </div>
      </div>

      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- SCREEN 3: NEST LOGIN -->
    <div id="screen-3" class="screen">
      <img class="bg-img" src="img3.png" alt="NEST Login Experience" />

      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(2)" title="Back">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="lang-dropdown-wrapper">
          <button class="lang-pill-btn" onclick="toggleLangMenu(event, 'langMenuLogin')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span class="selectedLangText">English</span>
            <span style="font-size: 7px; color: #444; margin-left: 2px;">▼</span>
          </button>
          
          <div class="lang-menu" id="langMenuLogin">
            <!-- Language List injected via JS -->
          </div>
        </div>
      </div>

      <!-- Real Reference Arch Login Card -->
      <div class="login-card-container">
        <div class="glass-arch-card">
          <div class="card-title">VISTAROQ IDENTITY</div>
          <div class="card-subtitle">Sign in to access your spaces, projects and everything you love.</div>

          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
            <input type="text" class="text-input" placeholder="Email or Mobile Number" id="userIdentifier" />
          </div>

          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" class="text-input" placeholder="Password" id="userPassword" />
            
            <svg class="toggle-pass-btn" viewBox="0 0 24 24" onclick="togglePasswordVisibility('userPassword')">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>

          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" checked />
              <span>Keep me signed in</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link" onclick="alert('Password reset link will be sent to your email/phone.')">Forgot Password?</a>
          </div>

          <button class="action-btn" onclick="handleSignIn()">
            <span>Sign In</span>
            <span style="font-size: 13px;">→</span>
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <button class="secondary-btn" onclick="goToScreen(4)">
            <svg style="width: 12px; height: 12px; stroke: #333; fill: none; stroke-width: 1.8;" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Create an Account</span>
            <span style="font-size: 12px; margin-left: 1px;">→</span>
          </button>
        </div>
      </div>
    </div>

    <!-- SCREEN 4: NEST SIGN UP / CREATE ACCOUNT (img3a.png) -->
    <div id="screen-4" class="screen">
      <img class="bg-img" src="img3a.png" alt="NEST Create Account Experience" />

      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(3)" title="Back to Login">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="lang-dropdown-wrapper">
          <button class="lang-pill-btn" onclick="toggleLangMenu(event, 'langMenuSignup')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span class="selectedLangText">English</span>
            <span style="font-size: 7px; color: #444; margin-left: 2px;">▼</span>
          </button>
          
          <div class="lang-menu" id="langMenuSignup">
            <!-- Language List injected via JS -->
          </div>
        </div>
      </div>

      <!-- Real Reference Arch Create Account Card -->
      <div class="signup-card-container">
        <div class="glass-arch-card">
          <div class="card-title">Create Your VISTAROQ Identity</div>
          <div class="card-subtitle">Join VISTAROQ and start turning your spaces into a better tomorrow.</div>

          <!-- Full Name -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" class="text-input" placeholder="Full Name" id="regFullName" />
          </div>

          <!-- Email or Mobile -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
            <input type="text" class="text-input" placeholder="Email or Mobile Number" id="regIdentifier" />
          </div>

          <!-- Create Password -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" class="text-input" placeholder="Create Password" id="regPassword" />
            <svg class="toggle-pass-btn" viewBox="0 0 24 24" onclick="togglePasswordVisibility('regPassword')">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>

          <!-- Confirm Password -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" class="text-input" placeholder="Confirm Password" id="regConfirmPassword" />
            <svg class="toggle-pass-btn" viewBox="0 0 24 24" onclick="togglePasswordVisibility('regConfirmPassword')">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>

          <!-- Terms Checkbox -->
          <div class="options-row" style="margin: 4px 2px 7px;">
            <label class="checkbox-label">
              <input type="checkbox" id="regTerms" checked />
              <span class="terms-text">I agree to the <a href="javascript:void(0)" onclick="alert('VISTAROQ Terms of Service')">Terms of Service</a> and <a href="javascript:void(0)" onclick="alert('VISTAROQ Privacy Policy')">Privacy Policy</a></span>
            </label>
          </div>

          <!-- Create Account Button -->
          <button class="action-btn" onclick="handleSignUp()">
            <span>Create Account</span>
            <span style="font-size: 13px;">→</span>
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <!-- Back to Sign In -->
          <button class="secondary-btn" onclick="goToScreen(3)">
            <span style="font-size: 12px; margin-right: 1px;">←</span>
            <span>Back to Sign In</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ========================================================
    // MEMORY CACHE
    // ========================================================
    const assetsToPreload = [
      'welcome.png', 'img2.png', 'nest.png', 'craft.png',
      'link.png', 'force.png', 'hub.png', 'img3.png', 'img3a.png'
    ];
    window.addEventListener('DOMContentLoaded', () => {
      assetsToPreload.forEach(src => {
        const img = new Image();
        img.src = src;
      });
      initLanguageMenus();
    });

    let currentScreen = 1;
    let currentCard = 0;
    const cards = document.querySelectorAll('.card-item');
    const dots = document.querySelectorAll('.dot');
    const totalCards = cards.length;

    function goToScreen(screenNumber) {
      document.getElementById('screen-' + currentScreen).classList.remove('active');
      document.getElementById('screen-' + screenNumber).classList.add('active');
      currentScreen = screenNumber;
      if (screenNumber === 2) updateCards();
    }

    function updateCards() {
      cards.forEach((card, index) => {
        card.className = 'card-item';
        if (index === currentCard) {
          card.classList.add('active');
        } else if (index === (currentCard - 1 + totalCards) % totalCards) {
          card.classList.add('prev');
        } else if (index === (currentCard + 1) % totalCards) {
          card.classList.add('next');
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentCard);
      });
    }

    function nextCard() {
      currentCard = (currentCard + 1) % totalCards;
      updateCards();
    }

    function prevCard() {
      currentCard = (currentCard - 1 + totalCards) % totalCards;
      updateCards();
    }

    function onCardClick(name) {
      if (name === 'NEST') {
        goToScreen(3);
      } else {
        alert('✨ Selected Experience: VISTAROQ ' + name);
      }
    }

    // Touch Swipe Detection
    const swipeArea = document.getElementById('swipeArea');
    let startX = 0;
    let endX = 0;

    swipeArea.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].clientX;
      const diffX = startX - endX;
      if (Math.abs(diffX) > 35) {
        if (diffX > 0) nextCard();
        else prevCard();
      }
    }, { passive: true });

    // Password Toggle Helper
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = (field.type === 'password') ? 'text' : 'password';
    }

    // Login Action
    function handleSignIn() {
      const user = document.getElementById('userIdentifier').value.trim();
      const pass = document.getElementById('userPassword').value.trim();
      if (!user) { alert('Please enter your Email or Mobile Number.'); return; }
      if (!pass) { alert('Please enter your Password.'); return; }
      alert('✨ Welcome to VISTAROQ NEST!\nUser: ' + user);
    }

    // Sign Up Action
    function handleSignUp() {
      const name = document.getElementById('regFullName').value.trim();
      const identifier = document.getElementById('regIdentifier').value.trim();
      const pass = document.getElementById('regPassword').value.trim();
      const confirmPass = document.getElementById('regConfirmPassword').value.trim();
      const terms = document.getElementById('regTerms').checked;

      if (!name) { alert('Please enter your Full Name.'); return; }
      if (!identifier) { alert('Please enter your Email or Mobile Number.'); return; }
      if (!pass) { alert('Please create a Password.'); return; }
      if (pass !== confirmPass) { alert('Passwords do not match!'); return; }
      if (!terms) { alert('Please agree to the Terms of Service & Privacy Policy.'); return; }

      alert('🎉 Account Created Successfully for ' + name + '!\nRedirecting to Sign In...');
      goToScreen(3);
    }

    // Multi-Language System
    const languages = [
      { group: 'Indian Languages', list: [
        { name: 'ಕನ್ನಡ', code: 'KN' }, { name: 'हिन्दी', code: 'HI' }, { name: 'தமிழ்', code: 'TA' },
        { name: 'తెలుగు', code: 'TE' }, { name: 'മലയാളം', code: 'ML' }, { name: 'मराठी', code: 'MR' },
        { name: 'বাংলা', code: 'BN' }, { name: 'ગુજરાતી', code: 'GU' }, { name: 'ਪੰਜਾਬੀ', code: 'PA' }, { name: 'ଓଡ଼ିଆ', code: 'OR' }
      ]},
      { group: 'International Languages', list: [
        { name: 'English', code: 'EN' }, { name: 'Español', code: 'ES' }, { name: 'Français', code: 'FR' },
        { name: 'Deutsch', code: 'DE' }, { name: 'العربية', code: 'AR' }, { name: '日本語', code: 'JA' },
        { name: '한국어', code: 'KO' }, { name: '中文 (简体)', code: 'ZH' }, { name: 'Русский', code: 'RU' },
        { name: 'Português', code: 'PT' }, { name: 'Italiano', code: 'IT' }, { name: 'Türkçe', code: 'TR' },
        { name: 'Bahasa Indo', code: 'ID' }, { name: 'Nederlands', code: 'NL' }, { name: 'Svenska', code: 'SV' },
        { name: 'Polski', code: 'PL' }, { name: 'Tiếng Việt', code: 'VI' }, { name: 'ภาษาไทย', code: 'TH' },
        { name: 'Ελληνικά', code: 'EL' }, { name: 'עברית', code: 'HE' }
      ]}
    ];

    function initLanguageMenus() {
      ['langMenuLogin', 'langMenuSignup'].forEach(menuId => {
        const menu = document.getElementById(menuId);
        let html = '';
        languages.forEach(cat => {
          html += `<div class="lang-group-header">${cat.group}</div>`;
          cat.list.forEach(l => {
            const activeClass = l.name === 'English' ? 'active' : '';
            html += `<div class="lang-item ${activeClass}" onclick="selectLanguage('${l.name}')">${l.name} <span>${l.code}</span></div>`;
          });
        });
        menu.innerHTML = html;
      });
    }

    function toggleLangMenu(e, menuId) {
      e.stopPropagation();
      const targetMenu = document.getElementById(menuId);
      document.querySelectorAll('.lang-menu').forEach(m => {
        if (m !== targetMenu) m.classList.remove('show');
      });
      targetMenu.classList.toggle('show');
    }

    function selectLanguage(lang) {
      document.querySelectorAll('.selectedLangText').forEach(el => el.innerText = lang);
      document.querySelectorAll('.lang-item').forEach(item => {
        item.classList.toggle('active', item.innerText.includes(lang));
      });
      document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('show'));
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('show'));
    });

    updateCards();
  </script>
</body>
</html>
