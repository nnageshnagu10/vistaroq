<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VISTAROQ</title>

  <!-- Preload Assets -->
  <link rel="preload" as="image" href="welcome.png" />
  <link rel="preload" as="image" href="img2.png" />
  <link rel="preload" as="image" href="nest.png" />
  <link rel="preload" as="image" href="craft.png" />
  <link rel="preload" as="image" href="link.png" />
  <link rel="preload" as="image" href="force.png" />
  <link rel="preload" as="image" href="hub.png" />
  <link rel="preload" as="image" href="img3.png" />
  <link rel="preload" as="image" href="img3a.png" />
  <link rel="preload" as="image" href="img4.png" />
  <link rel="preload" as="image" href="img5.png" />
  <link rel="preload" as="image" href="img6.png" />
  <link rel="preload" as="image" href="img7.png" />
  <link rel="preload" as="image" href="img8.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    
    /* Screen Isolation Architecture */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      overflow: hidden;
      z-index: 1;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 10;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Global Help (?) Button */
    .global-help-btn {
      position: absolute;
      top: 2.2%;
      right: 3.5%;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      z-index: 100;
      cursor: pointer;
    }

    /* Screen 1: Welcome CTA */
    .cta-btn {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 310px;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }
    .cta-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .cta-arrow {
      font-size: 15px;
      font-weight: 700;
      color: #b8860b;
    }

    /* Screen 2: Experience Hub & Carousel */
    .hub-btn {
      position: absolute;
      top: 1.6%;
      right: 15%;
      width: 21%;
      max-width: 88px;
      z-index: 50;
      cursor: pointer;
    }
    .hub-btn img { width: 100%; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }

    .cards-wrapper {
      position: absolute;
      top: 52%;
      left: 0;
      width: 100%;
      height: 31%;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cards-track { width: 100%; height: 100%; position: relative; }
    .card-item {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38%;
      max-width: 155px;
      height: 100%;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s ease, opacity 0.35s ease;
      cursor: pointer;
    }
    .card-item img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
    .card-item.active { transform: translateX(-50%) scale(1.05); opacity: 1; z-index: 20; pointer-events: auto; }
    .card-item.prev { transform: translateX(-138%) scale(0.8); opacity: 0.5; z-index: 10; pointer-events: auto; }
    .card-item.next { transform: translateX(38%) scale(0.8); opacity: 0.5; z-index: 10; pointer-events: auto; }

    .dots-container {
      position: absolute;
      bottom: 12%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 35;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      transition: all 0.25s ease;
    }
    .dot.active { background: #d4af37; border-color: #ffd700; transform: scale(1.25); }

    /* Navigation Header & Multi-Language */
    .nest-nav {
      position: absolute;
      top: 1.6%;
      left: 0;
      width: 100%;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }
    .clean-back-arrow { background: transparent; border: none; cursor: pointer; color: #fff; padding: 4px; }
    .clean-back-arrow svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.2; fill: none; }

    .lang-dropdown-wrapper { position: relative; }
    .lang-pill-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 18px;
      color: #1a1a1a;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-menu {
      position: absolute;
      top: 32px;
      right: 0;
      width: 180px;
      max-height: 220px;
      overflow-y: auto;
      background: rgba(18, 22, 28, 0.95);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 12px;
      display: none;
      z-index: 100;
    }
    .lang-menu.show { display: block; }
    .lang-item { padding: 7px 12px; font-size: 11.5px; color: #e8e8e8; cursor: pointer; display: flex; justify-content: space-between; }
    .lang-item:hover, .lang-item.active { background: rgba(212, 175, 55, 0.25); color: #ffd700; }

    /* Glass Cards (Login & Signup) */
    .login-card-container { position: absolute; bottom: 40px; right: 3.5%; width: 71%; max-width: 300px; z-index: 40; }
    .signup-card-container { position: absolute; bottom: 20px; right: 3.5%; width: 74%; max-width: 312px; z-index: 40; }
    .glass-arch-card {
      background: rgba(255, 245, 230, 0.45);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 245, 220, 0.7);
      border-radius: 80px 80px 20px 20px;
      padding: 18px 14px 12px;
      text-align: center;
    }
    .text-input {
      width: 100%;
      height: 32px;
      padding: 0 12px 0 30px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.9);
      font-size: 10px;
      margin-bottom: 6px;
    }
    .action-btn {
      width: 100%;
      height: 32px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #f7e09e 0%, #dbaf4f 50%, #b8840b 100%);
      color: #1a1a1a;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    /* Hub & Portals Hotspots */
    .hotspot-box-hub { position: absolute; top: 51.5%; left: 3.5%; width: 45%; height: 14.5%; z-index: 40; cursor: pointer; }
    .hotspot-box-open { position: absolute; top: 51.5%; right: 3.5%; width: 45%; height: 14.5%; z-index: 40; cursor: pointer; }
    .portal-hotspot { flex: 1; height: 100%; border-radius: 30px; cursor: pointer; }
    .portals-container { position: absolute; top: 42%; left: 2%; width: 96%; height: 34%; display: flex; gap: 1.5%; z-index: 40; }
    .measure-card-hotspot { flex: 1; height: 100%; border-radius: 18px; cursor: pointer; }
    .measure-methods-container { position: absolute; top: 59.5%; left: 3.5%; width: 93%; height: 27%; display: flex; gap: 2.5%; z-index: 40; }
    
    /* Screen Back Buttons */
    .screen-back-btn {
      position: absolute;
      top: env(safe-area-inset-top, 2%);
      left: 4%;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
    }
    .screen-back-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; fill: none; }

    /* Smart Scan (img7.png) Specific Hotspots */
    .smart-scan-back {
      position: absolute;
      top: 2%;
      left: 4%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      z-index: 60;
      cursor: pointer;
    }
    .smart-scan-finish {
      position: absolute;
      bottom: 3.5%;
      left: 4%;
      width: 92%;
      height: 7.5%;
      border-radius: 30px;
      background: transparent;
      z-index: 60;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- SCREEN 1: WELCOME -->
    <div id="screen-1" class="screen active">
      <div class="global-help-btn" onclick="alert('Help: Welcome')"></div>
      <img class="bg-img" src="welcome.png" alt="Welcome" />
      <button class="cta-btn" onclick="goToScreen(2)">
        <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <!-- SCREEN 2: EXPERIENCE CAROUSEL -->
    <div id="screen-2" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Experience')"></div>
      <img class="bg-img" src="img2.png" alt="Experience" />
      <div class="hub-btn" onclick="alert('⚡ VISTAROQ HUB: Employee Access Only')"><img src="hub.png" alt="Hub" /></div>
      
      <div class="cards-wrapper" id="swipeArea">
        <div class="cards-track">
          <div class="card-item active" onclick="onCardClick('NEST')"><img src="nest.png" alt="NEST" /></div>
          <div class="card-item next" onclick="alert('Selected: CRAFT')"><img src="craft.png" alt="CRAFT" /></div>
          <div class="card-item prev" onclick="alert('Selected: LINK')"><img src="link.png" alt="LINK" /></div>
        </div>
      </div>

      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- SCREEN 3: LOGIN -->
    <div id="screen-3" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Login')"></div>
      <img class="bg-img" src="img3.png" alt="Login" />
      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(2)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
        <div class="lang-dropdown-wrapper">
          <button class="lang-pill-btn" onclick="toggleLangMenu(event, 'langMenuLogin')">
            <span class="selectedLangText">English</span> ▾
          </button>
          <div class="lang-menu" id="langMenuLogin"></div>
        </div>
      </div>
      <div class="login-card-container">
        <div class="glass-arch-card">
          <div class="card-title" style="font-size:10px; font-weight:700; margin-bottom:8px;">VISTAROQ IDENTITY</div>
          <input type="text" class="text-input" placeholder="Email or Mobile" id="userIdentifier" />
          <input type="password" class="text-input" placeholder="Password" id="userPassword" />
          <button class="action-btn" onclick="handleSignIn()">Sign In →</button>
          <button class="action-btn" style="background:#fff; border:1px solid #ccc; margin-top:4px;" onclick="goToScreen(4)">Create Account</button>
        </div>
      </div>
    </div>

    <!-- SCREEN 4: SIGNUP -->
    <div id="screen-4" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Signup')"></div>
      <img class="bg-img" src="img3a.png" alt="Signup" />
      <div class="nest-nav">
        <button class="clean-back-arrow" onclick="goToScreen(3)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      </div>
      <div class="signup-card-container">
        <div class="glass-arch-card">
          <div style="font-size:10px; font-weight:700; margin-bottom:6px;">CREATE IDENTITY</div>
          <input type="text" class="text-input" placeholder="Full Name" />
          <input type="text" class="text-input" placeholder="Email / Mobile" />
          <input type="password" class="text-input" placeholder="Password" />
          <button class="action-btn" onclick="goToScreen(5)">Create Account →</button>
        </div>
      </div>
    </div>

    <!-- SCREEN 5: SPACES HUB -->
    <div id="screen-5" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Hub')"></div>
      <img class="bg-img" src="img4.png" alt="Hub" />
      <div class="hotspot-box-hub" onclick="goToScreen(6)"></div>
      <div class="hotspot-box-open" onclick="alert('📂 Opening Existing Space...')"></div>
    </div>

    <!-- SCREEN 6: CREATE SPACE PORTALS -->
    <div id="screen-6" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Portals')"></div>
      <img class="bg-img" src="img5.png" alt="Portals" />
      <button class="screen-back-btn" onclick="goToScreen(5)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      <div class="portals-container">
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
        <div class="portal-hotspot" onclick="goToScreen(7)"></div>
      </div>
    </div>

    <!-- SCREEN 7: MEASURE YOUR SPACE -->
    <div id="screen-7" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Measure')"></div>
      <img class="bg-img" src="img6.png" alt="Measure" />
      <button class="screen-back-btn" onclick="goToScreen(6)"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
      <div class="measure-methods-container">
        <!-- SCAN WITH CAMERA -> Goes to Screen 8 (img7.png) -->
        <div class="measure-card-hotspot" onclick="goToScreen(8)"></div>
        <div class="measure-card-hotspot" onclick="alert('Manual Entry Selected')"></div>
        <div class="measure-card-hotspot" onclick="alert('Upload Floor Plan Selected')"></div>
      </div>
    </div>

    <!-- SCREEN 8: SMART SPACE SCAN (img7.png) -->
    <div id="screen-8" class="screen">
      <div class="global-help-btn" onclick="alert('Help: Scan')"></div>
      <img class="bg-img" src="img7.png" alt="Smart Space Scan" />
      
      <!-- Back Arrow (←) to Screen 7 -->
      <div class="smart-scan-back" onclick="goToScreen(7)" title="Back"></div>

      <!-- Help (?) Button -->
      <div class="global-help-btn" onclick="alert('Help: Smart Space Scan')" title="Help"></div>

      <!-- FINISH & PROCESS Button -> Goes to Next Step (img8.png / Screen 9) -->
      <div class="smart-scan-finish" onclick="goToScreen(9)" title="Finish & Process"></div>
    </div>

    <!-- SCREEN 9: SPACE UNDERSTANDING (Placeholder for next step) -->
    <div id="screen-9" class="screen" style="background:#090b0e; display:flex; justify-content:center; align-items:center; color:#ffd700; font-size:16px; font-weight:700;">
      <div style="text-align:center;">
        <p>✨ Next Step: Space Understanding (img8.png)</p>
        <button onclick="goToScreen(8)" style="margin-top:15px; padding:8px 16px; background:#d4af37; border:none; border-radius:12px; color:#000; font-weight:700; cursor:pointer;">Back to Scan</button>
      </div>
    </div>

  </div>

  <script>
    let currentScreen = 1;
    function goToScreen(screenNumber) {
      document.getElementById('screen-' + currentScreen).classList.remove('active');
      document.getElementById('screen-' + screenNumber).classList.add('active');
      currentScreen = screenNumber;
    }

    const languages = [
      { group: 'Indian Languages', list: [
        { name: 'ಕನ್ನಡ', code: 'KN' }, { name: 'ಹಿन्दी', code: 'HI' }, { name: 'தமிழ்', code: 'TA' },
        { name: 'తెలుగు', code: 'TE' }, { name: 'മലയാളം', code: 'ML' }, { name: 'ಮರಾಠಿ', code: 'MR' }
      ]},
      { group: 'International Languages', list: [
        { name: 'English', code: 'EN' }, { name: 'Español', code: 'ES' }, { name: 'Français', code: 'FR' },
        { name: 'Deutsch', code: 'DE' }, { name: 'العربية', code: 'AR' }, { name: '日本語', code: 'JA' }
      ]}
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initLanguageMenus();
    });

    function initLanguageMenus() {
      const menu = document.getElementById('langMenuLogin');
      if (!menu) return;
      let html = '';
      languages.forEach(cat => {
        html += `<div class="lang-group-header" style="padding:4px 8px; font-size:9px; color:#d4af37;">${cat.group}</div>`;
        cat.list.forEach(l => {
          html += `<div class="lang-item" onclick="selectLanguage('${l.name}')">${l.name} <span>${l.code}</span></div>`;
        });
      });
      menu.innerHTML = html;
    }

    function toggleLangMenu(e, menuId) {
      e.stopPropagation();
      document.getElementById(menuId).classList.toggle('show');
    }

    function selectLanguage(lang) {
      document.querySelector('.selectedLangText').innerText = lang;
      document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('show'));
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.lang-menu').forEach(m => m.classList.remove('show'));
    });
  </script>
</body>
</html>
