<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-screen {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* ಬಟನ್ ಅಗಲವನ್ನು ಕಡಿಮೆ ಮಾಡಿ, ಸೆಂಟರ್‌ನಲ್ಲಿ ಕಾಂಪ್ಯಾಕ್ಟ್ & ಪ್ರೀಮಿಯಂ ಆಗಿ ಕೂರಿಸಲಾಗಿದೆ */
    .cta-btn {
      position: absolute;
      bottom: 82px;
      width: 72%;
      max-width: 310px;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .cta-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 8px;
      white-space: nowrap;
    }
    .cta-arrow {
      font-size: 15px;
      font-weight: 700;
      color: #b8860b;
      line-height: 1;
    }
    .cta-btn:active {
      transform: scale(0.97);
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
    
    <button class="cta-btn" onclick="alert('✨ VISTAROQ: Screen 01 Ready!')">
      <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
      <span class="cta-arrow">→</span>
    </button>
  </div>

</body>
</html>
