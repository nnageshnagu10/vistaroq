<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
      overflow: hidden;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- SCREEN 1: WELCOME BUTTON --- */
    .cta-btn {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 310px;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease;
    }
    .cta-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
    .cta-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .cta-arrow {
      font-size: 15px;
      font-weight: 700;
      color: #b8860b;
    }

    /* --- SCREEN 2: HUB BUTTON --- */
    .hub-btn {
      position: absolute;
      top: 1.6%;
      right: 3.5%;
      width: 21%;
      max-width: 88px;
      z-index: 15;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .hub-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }
    .hub-btn:active {
      transform: scale(0.92);
    }

    /* --- SCREEN 2: CARD SLIDER --- */
    .cards-wrapper {
      position: absolute;
      top: 52%;
      left: 0;
      width: 100%;
      height: 31%;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }
    .cards-track {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .card-item {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38%;
      max-width: 155px;
      height: 100%;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
      cursor: pointer;
    }
    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
    }
    .card-item.active {
      transform: translateX(-50%) scale(1.05);
      opacity: 1;
      z-index: 10;
      pointer-events: auto;
    }
    .card-item.prev {
      transform: translateX(-138%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }
    .card-item.next {
      transform: translateX(38%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }

    /* --- SCREEN 2: DOT INDICATORS --- */
    .dots-container {
      position: absolute;
      bottom: 12%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 15;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #d4af37;
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      transform: scale(1.25);
    }

    /* =========================================
       SCREEN 3: REFINED LUXURY NEST LOGIN UI
       ========================================= */
    .nest-nav {
      position: absolute;
      top: 2%;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    
    /* Clean Minimalist Luxury Back Arrow */
    .clean-back-arrow {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: #ffffff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
      transition: transform 0.15s ease;
    }
    .clean-back-arrow svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2.2;
    }
    .clean-back-arrow:active {
      transform: scale(0.9);
    }

    /* Global Language Dropdown Container */
    .lang-dropdown-wrapper {
      position: relative;
    }
    .lang-pill-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 22px;
      color: #1a1a1a;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .lang-pill-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #333;
      stroke-width: 1.8;
    }
    .lang-menu {
      position: absolute;
      top: 38px;
      right: 0;
      width: 160px;
      max-height: 220px;
      overflow-y: auto;
      background: rgba(20, 24, 30, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      z-index: 100;
    }
    .lang-menu.show {
      display: block;
    }
    .lang-item {
      padding: 9px 14px;
      font-size: 12px;
      color: #e5e5e5;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease;
    }
    .lang-item:hover, .lang-item.active {
      background: rgba(212, 175, 55, 0.25);
      color: #ffd700;
    }

    /* Authentic Frosted Marble Floating Card */
    .login-card-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 375px;
      z-index: 25;
    }
    .login-card {
      /* Realistic Ultra-Glassmorphism Matching img2 reference */
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(245, 238, 220, 0.35) 100%);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1.2px solid rgba(255, 245, 225, 0.65);
      border-radius: 34px;
      padding: 20px 22px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      text-align: center;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #111;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 10.5px;
      color: #333;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 15px;
      padding: 0 6px;
    }

    /* Clean Frosted Inputs */
    .input-field {
      position: relative;
      margin-bottom: 10px;
      width: 100%;
    }
    .input-icon-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      stroke: #555;
      fill: none;
      stroke-width: 1.8;
    }
    .text-input {
      width: 100%;
      height: 40px;
      padding: 0 38px 0 38px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      color: #111;
      transition: all 0.2s ease;
    }
    .text-input::placeholder {
      color: #666;
    }
    .text-input:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .toggle-pass-btn {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: #555;
      fill: none;
      stroke-width: 1.8;
      cursor: pointer;
    }

    /* Options Row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      margin: 8px 4px 13px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #222;
      font-weight: 500;
      cursor: pointer;
    }
    .remember-me input {
      accent-color: #b8860b;
    }
    .forgot-link {
      color: #8c6a21;
      text-decoration: none;
      font-weight: 700;
    }

    /* Sign In Button */
    .signin-btn {
      width: 100%;
      height: 42px;
      border-radius: 21px;
      border: 1px solid rgba(255, 235, 175, 0.6);
      background: linear-gradient(135deg, #f7e09e 0%, #dbaf4f 50%, #b8840b 100%);
      color: #1a1a1a;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 5px 18px rgba(184, 134, 11, 0.38);
      transition: transform 0.15s ease;
    }
    .signin-btn:active {
      transform: scale(0.97);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 9px 0;
      color: #555;
      font-size: 9.5px;
      font-weight: 700;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
    }
    .divider span {
      padding: 0 8px;
    }

    /* Create Account Button */
    .create-btn {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.88);
      color: #1a1a1a;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease;
    }
    .create-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- SCREEN 1: WELCOME -->
    <div id="screen-1" class="screen active">
      <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
      <button class="cta-btn" onclick="goToScreen(2)">
        <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <!-- SCREEN 2: EXPERIENCE CAROUSEL -->
    <div id="screen-2" class="screen">
      <img class="bg-img" src="img2.png" alt="VISTAROQ Experience" />

      <div class="hub-btn" onclick="alert('⚡ VISTAROQ HUB: Employee Access Only')">
        <img src="hub.png" alt="VISTAROQ HUB" />
      </div>

      <div class="cards-wrapper" id="swipeArea">
        <div class="cards-track">
          <div class="card-item" onclick="onCardClick('NEST')">
            <img src="nest.png" alt="NEST" />
          </div>
          <div class="card-item" onclick="onCardClick('CRAFT')">
            <img src="craft.png" alt="CRAFT" />
          </div>
          <div class="card-item" onclick="onCardClick('LINK')">
            <img src="link.png" alt="LINK" />
          </div>
          <div class="card-item" onclick="onCardClick('FORCE')">
            <img src="force.png" alt="FORCE" />
          </div>
        </div>
      </div>

      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- SCREEN 3: REFINED NEST LOGIN -->
    <div id="screen-3" class="screen">
      <img class="bg-img" src="img3.png" alt="NEST Login Experience" />

      <!-- Top Minimal Navigation -->
      <div class="nest-nav">
        <!-- Clean Luxury Back Arrow -->
        <button class="clean-back-arrow" onclick="goToScreen(2)" title="Back">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Global Multi-Language Selector -->
        <div class="lang-dropdown-wrapper">
          <button class="lang-pill-btn" onclick="toggleLangMenu(event)">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span id="selectedLangText">English</span>
            <span style="font-size: 8px; color: #555; margin-left: 2px;">▼</span>
          </button>
          
          <div class="lang-menu" id="langMenu">
            <div class="lang-item active" onclick="selectLanguage('English')">English</div>
            <div class="lang-item" onclick="selectLanguage('ಕನ್ನಡ')">ಕನ್ನಡ (Kannada)</div>
            <div class="lang-item" onclick="selectLanguage('हिन्दी')">हिन्दी (Hindi)</div>
            <div class="lang-item" onclick="selectLanguage('Español')">Español (Spanish)</div>
            <div class="lang-item" onclick="selectLanguage('Français')">Français (French)</div>
            <div class="lang-item" onclick="selectLanguage('Deutsch')">Deutsch (German)</div>
            <div class="lang-item" onclick="selectLanguage('العربية')">العربية (Arabic)</div>
            <div class="lang-item" onclick="selectLanguage('日本語')">日本語 (Japanese)</div>
          </div>
        </div>
      </div>

      <!-- Luxury Frosted Marble Floating Card -->
      <div class="login-card-container">
        <div class="login-card">
          <div class="card-title">VISTAROQ IDENTITY</div>
          <div class="card-subtitle">Sign in to access your spaces, projects and everything you love.</div>

          <!-- Email / Phone Input -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="M3 7l9 6 9-6"/>
            </svg>
            <input type="text" class="text-input" placeholder="Email or Mobile Number" id="userIdentifier" />
          </div>

          <!-- Password Input -->
          <div class="input-field">
            <svg class="input-icon-svg" viewBox="0 0 24 24">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" class="text-input" placeholder="Password" id="userPassword" />
            
            <svg class="toggle-pass-btn" id="eyeIcon" viewBox="0 0 24 24" onclick="togglePasswordVisibility()">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>

          <!-- Keep me signed in & Forgot Password -->
          <div class="options-row">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" checked />
              <span>Keep me signed in</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link" onclick="alert('Password reset link will be sent to your email/phone.')">Forgot Password?</a>
          </div>

          <!-- Sign In Button -->
          <button class="signin-btn" onclick="handleSignIn()">
            <span>Sign In</span>
            <span style="font-size: 15px;">→</span>
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <!-- Create Account Button -->
          <button class="create-btn" onclick="alert('Creating new VISTAROQ account...')">
            <svg style="width: 14px; height: 14px; stroke: #333; fill: none; stroke-width: 1.8;" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Create an Account</span>
            <span style="font-size: 14px; margin-left: 2px;">→</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentScreen = 1;
    let currentCard = 0;
    const cards = document.querySelectorAll('.card-item');
    const dots = document.querySelectorAll('.dot');
    const totalCards = cards.length;

    function goToScreen(screenNumber) {
      document.getElementById('screen-' + currentScreen).classList.remove('active');
      document.getElementById('screen-' + screenNumber).classList.add('active');
      currentScreen = screenNumber;
      if (screenNumber === 2) updateCards();
    }

    function updateCards() {
      cards.forEach((card, index) => {
        card.className = 'card-item';
        if (index === currentCard) {
          card.classList.add('active');
        } else if (index === (currentCard - 1 + totalCards) % totalCards) {
          card.classList.add('prev');
        } else if (index === (currentCard + 1) % totalCards) {
          card.classList.add('next');
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentCard);
      });
    }

    function nextCard() {
      currentCard = (currentCard + 1) % totalCards;
      updateCards();
    }

    function prevCard() {
      currentCard = (currentCard - 1 + totalCards) % totalCards;
      updateCards();
    }

    function onCardClick(name) {
      if (name === 'NEST') {
        goToScreen(3);
      } else {
        alert('✨ Selected Experience: VISTAROQ ' + name);
      }
    }

    // Touch Swipe Detection
    const swipeArea = document.getElementById('swipeArea');
    let startX = 0;
    let endX = 0;

    swipeArea.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].clientX;
      const diffX = startX - endX;
      if (Math.abs(diffX) > 35) {
        if (diffX > 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }, { passive: true });

    // Login Screen Logic
    function togglePasswordVisibility() {
      const passInput = document.getElementById('userPassword');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }

    function handleSignIn() {
      const user = document.getElementById('userIdentifier').value.trim();
      const pass = document.getElementById('userPassword').value.trim();
      if (!user) {
        alert('Please enter your Email or Mobile Number.');
        return;
      }
      if (!pass) {
        alert('Please enter your Password.');
        return;
      }
      alert('✨ Welcome to VISTAROQ NEST!\nUser: ' + user);
    }

    // Multi-Language Dropdown
    function toggleLangMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('langMenu');
      menu.classList.toggle('show');
    }

    function selectLanguage(lang) {
      document.getElementById('selectedLangText').innerText = lang;
      document.querySelectorAll('.lang-item').forEach(item => {
        item.classList.toggle('active', item.innerText.includes(lang));
      });
      document.getElementById('langMenu').classList.remove('show');
    }

    // Close menu when clicked outside
    document.addEventListener('click', () => {
      const menu = document.getElementById('langMenu');
      if (menu) menu.classList.remove('show');
    });

    updateCards();
  </script>
</body>
</html>
