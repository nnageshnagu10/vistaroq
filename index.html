<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-screen {
      width: 100vw;
      max-width: 450px;
      height: 100vh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }
    /* ಕೋಡಿಂಗ್ ಮೂಲಕ ನಿರ್ಮಿಸಿದ ಪ್ರೀಮಿಯಂ ಗೋಲ್ಡನ್ ಬಟನ್ */
    .cta-btn {
      position: absolute;
      bottom: 8.8%;
      left: 7%;
      width: 86%;
      height: 52px;
      border-radius: 30px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .cta-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 14px;
      white-space: nowrap;
    }
    .cta-arrow {
      font-size: 18px;
      font-weight: 600;
      color: #b8860b;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .cta-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.5);
    }
    .cta-btn:active .cta-arrow {
      transform: translateX(3px);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
    
    <!-- ಅಸಲಿ ಕೋಡಿಂಗ್ UI ಬಟನ್ -->
    <button class="cta-btn" onclick="alert('✨ VISTAROQ: Screen 01 Ready!')">
      <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
      <span class="cta-arrow">→</span>
    </button>
  </div>

</body>
</html>
