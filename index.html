<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .app-screen {
      width: 100vw;
      max-width: 450px;
      height: 100vh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }
    /* ಇಮೇಜ್‌ನಲ್ಲಿರುವ ಬಟನ್ ಮೇಲೆಯೇ ಸರಿಯಾಗಿ ಕೂರುವ ನಿಖರವಾದ ಟಚ್ ಜಾಗ */
    .touch-btn {
      position: absolute;
      bottom: 8.8%;
      left: 14%;
      width: 72%;
      height: 60px;
      border-radius: 30px;
      border: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      z-index: 10;
    }
    /* ಮುಟ್ಟಿದಾಗ ಮಾತ್ರ ಲಘುವಾದ ಗೋಲ್ಡನ್ ಸ್ಪರ್ಶ */
    .touch-btn:active {
      background: rgba(223, 178, 106, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
    <button class="touch-btn" onclick="alert('✨ VISTAROQ: Welcome Screen Verified!')" aria-label="Choose Experience">
    </button>
  </div>

</body>
</html>
