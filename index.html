<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VISTAROQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #090b0e;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
    }
    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- SCREEN 1: WELCOME BUTTON --- */
    .cta-btn {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 310px;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1.5px solid #d4af37;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease;
    }
    .cta-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
    .cta-text {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #1a1a1a;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .cta-arrow {
      font-size: 15px;
      font-weight: 700;
      color: #b8860b;
    }

    /* --- SCREEN 2: HUB BUTTON (ಇನ್ನೂ ಸ್ಮಾಲ್ & ಮೇಲೆ ಅಡ್ಜಸ್ಟ್ ಮಾಡಲಾಗಿದೆ) --- */
    .hub-btn {
      position: absolute;
      top: 2.8%;
      right: 4.5%;
      width: 27%;
      max-width: 110px;
      z-index: 15;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .hub-btn img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }
    .hub-btn:active {
      transform: scale(0.92);
    }

    /* --- SCREEN 2: CARD SLIDER (ಚಿಕ್ಕದಾಗಿಸಿ ಕೆಳಭಾಗಕ್ಕೆ ಇಳಿಸಲಾಗಿದೆ) --- */
    .cards-wrapper {
      position: absolute;
      top: 52%;
      left: 0;
      width: 100%;
      height: 31%;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }
    .cards-track {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .card-item {
      position: absolute;
      top: 0;
      left: 50%;
      width: 38%;
      max-width: 155px;
      height: 100%;
      transform: translateX(-50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
      cursor: pointer;
    }
    .card-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
    }
    .card-item.active {
      transform: translateX(-50%) scale(1.05);
      opacity: 1;
      z-index: 10;
      pointer-events: auto;
    }
    .card-item.prev {
      transform: translateX(-138%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }
    .card-item.next {
      transform: translateX(38%) scale(0.8);
      opacity: 0.5;
      z-index: 5;
      pointer-events: auto;
    }
    .card-item:active img {
      transform: scale(0.96);
    }

    /* --- SCREEN 2: DOT INDICATORS --- */
    .dots-container {
      position: absolute;
      bottom: 12%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 15;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #d4af37;
      border-color: #ffd700;
      box-shadow: 0 0 8px #ffd700;
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- SCREEN 1: WELCOME -->
    <div id="screen-1" class="screen active">
      <img class="bg-img" src="welcome.png" alt="VISTAROQ Welcome" />
      <button class="cta-btn" onclick="goToScreen(2)">
        <span class="cta-text">CHOOSE YOUR VISTAROQ EXPERIENCE</span>
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <!-- SCREEN 2: EXPERIENCE CAROUSEL -->
    <div id="screen-2" class="screen">
      <img class="bg-img" src="img2.png" alt="VISTAROQ Experience" />

      <!-- Top Small HUB Button -->
      <div class="hub-btn" onclick="alert('⚡ VISTAROQ HUB: Employee Access Only')">
        <img src="hub.png" alt="VISTAROQ HUB" />
      </div>

      <!-- Compact Swipable Cards -->
      <div class="cards-wrapper" id="swipeArea">
        <div class="cards-track">
          <div class="card-item" onclick="onCardClick('NEST')">
            <img src="nest.png" alt="NEST" />
          </div>
          <div class="card-item" onclick="onCardClick('CRAFT')">
            <img src="craft.png" alt="CRAFT" />
          </div>
          <div class="card-item" onclick="onCardClick('LINK')">
            <img src="link.png" alt="LINK" />
          </div>
          <div class="card-item" onclick="onCardClick('FORCE')">
            <img src="force.png" alt="FORCE" />
          </div>
        </div>
      </div>

      <!-- 4 Dynamic Dots -->
      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

  </div>

  <script>
    let currentScreen = 1;
    let currentCard = 0;
    const cards = document.querySelectorAll('.card-item');
    const dots = document.querySelectorAll('.dot');
    const totalCards = cards.length;

    function goToScreen(screenNumber) {
      document.getElementById('screen-' + currentScreen).classList.remove('active');
      document.getElementById('screen-' + screenNumber).classList.add('active');
      currentScreen = screenNumber;
      if (screenNumber === 2) updateCards();
    }

    function updateCards() {
      cards.forEach((card, index) => {
        card.className = 'card-item';
        if (index === currentCard) {
          card.classList.add('active');
        } else if (index === (currentCard - 1 + totalCards) % totalCards) {
          card.classList.add('prev');
        } else if (index === (currentCard + 1) % totalCards) {
          card.classList.add('next');
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentCard);
      });
    }

    function nextCard() {
      currentCard = (currentCard + 1) % totalCards;
      updateCards();
    }

    function prevCard() {
      currentCard = (currentCard - 1 + totalCards) % totalCards;
      updateCards();
    }

    function onCardClick(name) {
      alert('✨ Selected Experience: VISTAROQ ' + name);
    }

    // Touch Swipe Detection
    const swipeArea = document.getElementById('swipeArea');
    let startX = 0;
    let endX = 0;

    swipeArea.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].clientX;
      const diffX = startX - endX;
      if (Math.abs(diffX) > 35) {
        if (diffX > 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }, { passive: true });

    updateCards();
  </script>
</body>
</html>
